name: Update revenge.bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout revenge-tsantiqueshop
        uses: actions/checkout@v7

      - name: Find latest allowed Revenge build
        id: latest
        env:
          GH_TOKEN: ${{ secrets.REVENGE_TOKEN }}
        run: |
          # Add run IDs you want to skip here.
          EXEMPT_RUNS=(
            39983030995
          )

          echo "Exempted runs:"
          printf '%s\n' "${EXEMPT_RUNS[@]}"

          # Get the latest successful runs, newest first.
          mapfile -t RUNS < <(
            gh run list \
              --repo revenge-mod/revenge-bundle-next \
              --workflow build.yml \
              --branch main \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )

          if [ "${#RUNS[@]}" -eq 0 ]; then
            echo "Could not find any successful Build workflow runs."
            exit 1
          fi

          SELECTED_RUN=""

          for RUN_ID in "${RUNS[@]}"; do
            EXEMPT=false

            for EXEMPT_ID in "${EXEMPT_RUNS[@]}"; do
              if [ "$RUN_ID" = "$EXEMPT_ID" ]; then
                EXEMPT=true
                break
              fi
            done

            if [ "$EXEMPT" = true ]; then
              echo "Skipping exempted run: $RUN_ID"
              continue
            fi

            SELECTED_RUN="$RUN_ID"
            break
          done

          if [ -z "$SELECTED_RUN" ]; then
            echo "Could not find a non-exempt successful build."
            exit 1
          fi

          echo "Selected run: $SELECTED_RUN"
          echo "run_id=$SELECTED_RUN" >> "$GITHUB_OUTPUT"

      - name: Download revenge-bundle artifact
        env:
          GH_TOKEN: ${{ secrets.REVENGE_TOKEN }}
        run: |
          mkdir -p downloaded-artifact

          gh run download "${{ steps.latest.outputs.run_id }}" \
            --repo revenge-mod/revenge-bundle-next \
            --name revenge-bundle \
            --dir downloaded-artifact

      - name: Replace revenge.bundle
        run: |
          BUNDLE=$(find downloaded-artifact -type f -name "revenge.bundle" | head -n 1)

          if [ -z "$BUNDLE" ]; then
            echo "ERROR: revenge.bundle was not found inside revenge-bundle."
            find downloaded-artifact -type f
            exit 1
          fi

          echo "Found bundle at: $BUNDLE"

          # Check if this exact bundle is already installed.
          if [ -f "./revenge.bundle" ] && cmp -s "$BUNDLE" "./revenge.bundle"; then
            echo "revenge.bundle from run ${{ steps.latest.outputs.run_id }} is already installed."
            rm -rf downloaded-artifact
            exit 0
          fi

          echo "Installing revenge.bundle from run ${{ steps.latest.outputs.run_id }}"

          cp "$BUNDLE" ./revenge.bundle

          rm -rf downloaded-artifact

      - name: Commit updated revenge.bundle
        run: |
          if git diff --quiet -- revenge.bundle; then
            echo "No revenge.bundle update needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add revenge.bundle
          git commit -m "Auto-update revenge.bundle from run ${{ steps.latest.outputs.run_id }}"
          git push

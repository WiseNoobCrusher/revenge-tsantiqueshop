name: Update revenge.bundle

on:
  workflow_dispatch:

  schedule:
    # Check every 30 minutes
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout revenge-tsantiqueshop
        uses: actions/checkout@v6

      - name: Find latest successful Revenge build
        id: build
        env:
          GH_TOKEN: ${{ secrets.REVENGE_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --repo OWNER/SOURCE-REPO \
            --workflow build.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download revenge-bundle artifact
        env:
          GH_TOKEN: ${{ secrets.REVENGE_TOKEN }}
        run: |
          mkdir artifact

          gh run download "${{ steps.build.outputs.run_id }}" \
            --repo OWNER/SOURCE-REPO \
            --name revenge-bundle \
            --dir artifact

      - name: Find and copy revenge.bundle
        run: |
          BUNDLE=$(find artifact -type f -name "revenge.bundle" | head -n 1)

          if [ -z "$BUNDLE" ]; then
            echo "revenge.bundle was not found in the artifact."
            exit 1
          fi

          cp "$BUNDLE" ./revenge.bundle

      - name: Commit update
        run: |
          if git diff --quiet -- revenge.bundle; then
            echo "revenge.bundle is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add revenge.bundle
          git commit -m "Update revenge.bundle"
          git push
